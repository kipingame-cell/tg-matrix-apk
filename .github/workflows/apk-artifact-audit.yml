name: Read-only APK and artifact audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Read releases, inspect APK hashes, report artifact inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, shutil, subprocess, tempfile, urllib.request, urllib.parse, urllib.error, zipfile
          REPO=os.environ['GITHUB_REPOSITORY'];BASE='https://api.github.com/repos/'+REPO;TOKEN=os.environ['GH_TOKEN'];TEMP=pathlib.Path(tempfile.mkdtemp(prefix='apk-audit-'))
          class Redirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):
            result=super().redirect_request(req,fp,code,msg,headers,newurl)
            if result and urllib.parse.urlparse(req.full_url).netloc!=urllib.parse.urlparse(newurl).netloc:result.remove_header('Authorization')
            return result
          OPENER=urllib.request.build_opener(Redirect)
          def request(path,binary=False,dest=None):
           url=path if path.startswith('https://') else BASE+path
           headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/octet-stream' if binary and '/releases/assets/' in url else 'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'read-only-apk-audit'}
           with OPENER.open(urllib.request.Request(url,headers=headers,method='GET'),timeout=180) as response:
            if dest:
             size=0
             with open(dest,'wb') as out:
              while True:
               chunk=response.read(1024*1024)
               if not chunk:break
               size+=len(chunk)
               if size>1024*1024*1024:raise RuntimeError('Read limit: 1 GiB')
               out.write(chunk)
             return size
            return json.load(response)
          def pages(path,key=None):
           result=[]
           for page in range(1,101):
            data=request(path+('&' if '?' in path else '?')+'per_page=100&page='+str(page));items=data[key] if key else data;result.extend(items)
            if len(items)<100:return result
           raise RuntimeError('Pagination bound')
          def sha(path):
           h=hashlib.sha256()
           with open(path,'rb') as f:
            for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
           return h.hexdigest()
          REPORT={'repo':REPO,'artifacts':[],'releases':[],'errors':[]}
          try:
           repo=request('');REPORT['default_branch']=repo['default_branch']
           try:REPORT['latest_release']=request('/releases/latest')['html_url']
           except urllib.error.HTTPError as e:
            if e.code!=404:raise
            REPORT['latest_release']=None
           sdk=pathlib.Path(os.environ.get('ANDROID_HOME','/usr/local/lib/android/sdk'))
           signers=list((sdk/'build-tools').glob('*/apksigner'));signer=str(sorted(signers)[-1]) if signers else None;aapt=str(pathlib.Path(signer).with_name('aapt')) if signer else None
           releases=pages('/releases')
           for release in releases:
            row={k:release.get(k) for k in ['id','tag_name','name','draft','prerelease','published_at','target_commitish','html_url']};row['assets']=[]
            for asset in release['assets']:
             item={k:asset.get(k) for k in ['id','name','size','digest','browser_download_url','url']}
             if asset['name'].lower().endswith('.apk') and not asset.get('digest'):
              try:
               file=TEMP/('release-'+str(asset['id'])+'.apk');request(asset['url'],True,file);item['digest']='sha256:'+sha(file);file.unlink()
              except Exception as e:item['error']=str(e)
             row['assets'].append(item)
            REPORT['releases'].append(row)
           artifacts=pages('/actions/artifacts','artifacts');cache={}
           for artifact in artifacts:
            row={k:artifact.get(k) for k in ['id','name','size_in_bytes','expired','created_at','updated_at','archive_download_url','workflow_run']};row['apks']=[]
            if not artifact['expired']:
             zfile=TEMP/('artifact-'+str(artifact['id'])+'.zip')
             try:
              runid=artifact['workflow_run']['id']
              if runid not in cache:cache[runid]=request('/actions/runs/'+str(runid))
              run=cache[runid];row['run']={k:run.get(k) for k in ['id','name','run_number','status','conclusion','head_branch','head_sha','html_url','created_at','path']}
              if run['status']!='completed':row['skipped']='run active';REPORT['artifacts'].append(row);continue
              request(artifact['archive_download_url'],True,zfile)
              with zipfile.ZipFile(zfile) as z:
               entries=[e for e in z.infolist() if not e.is_dir()];row['files']=[{'name':e.filename,'size':e.file_size} for e in entries]
               for entry in entries:
                if not entry.filename.lower().endswith('.apk'):continue
                record={'filename':entry.filename,'size':entry.file_size}
                if entry.file_size>512*1024*1024:record['error']='APK size bound';row['apks'].append(record);continue
                file=TEMP/('apk-'+str(artifact['id'])+'-'+hashlib.sha256(entry.filename.encode()).hexdigest()[:12]+'.apk')
                with z.open(entry) as source,open(file,'wb') as out:shutil.copyfileobj(source,out)
                record['sha256']=sha(file)
                if signer:
                 result=subprocess.run([signer,'verify','--print-certs',str(file)],text=True,capture_output=True,timeout=90);record['signature_valid']=result.returncode==0
                 cert=re.search(r'Signer #1 certificate SHA-256 digest: (\w+)',result.stdout)
                 if cert:record['certificate_sha256']=cert.group(1)
                 data=subprocess.run([aapt,'dump','badging',str(file)],text=True,capture_output=True,timeout=90)
                 package=re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']*)'",data.stdout)
                 if package:record.update(package=package.group(1),version_code=package.group(2),version_name=package.group(3),debuggable='application-debuggable' in data.stdout)
                row['apks'].append(record);file.unlink(missing_ok=True)
             except Exception as e:row['error']=str(e)
             finally:zfile.unlink(missing_ok=True)
            REPORT['artifacts'].append(row)
           try:
            files=request('/contents/.github/workflows');REPORT['workflows']=[{'path':f['path'],'sha':f['sha']} for f in files if f['name'].endswith(('.yml','.yaml'))]
           except urllib.error.HTTPError as e:
            if e.code!=404:raise
           REPORT['status']='completed'
          except Exception as e:REPORT['status']='failed';REPORT['errors'].append(str(e))
          finally:
           print('APK_READ_ONLY_AUDIT='+json.dumps(REPORT,ensure_ascii=False),flush=True)
           with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write('# Read-only APK audit\n\nNo releases or artifacts were changed or deleted.\n\n```json\n'+json.dumps(REPORT,ensure_ascii=False,indent=2)+'\n```\n')
           shutil.rmtree(TEMP,ignore_errors=True)
          if REPORT['status']!='completed':raise SystemExit(1)
